# Local PostGIS for the pilot database:  docker compose up -d db
# then set DATABASE_URL=postgresql+psycopg://nariway:nariway@localhost:5432/nariway (pip install psycopg[binary])
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nariway
      POSTGRES_PASSWORD: nariway
      POSTGRES_DB: nariway
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
